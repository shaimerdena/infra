services:
  db:
    image: postgres:17-alpine3.20
    container_name: postgres_db
    environment:
      - POSTGRES_USER=kbtu_admin
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=devops_sila
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devops_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbtu_admin -d devops_sila"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:

networks:
  devops_net:
    driver: bridge